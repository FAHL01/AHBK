<style id="appstyle">
/* Layout: dark charcoal wall like the sign, logo as a spotlit plaque, menu as a dotted-leader price list */
:root{
  --bg:#1b1e22; --panel:#262a2f; --line:#3d434b;
  --cream:#f0e9d6; --orange:#e8651f; --orange2:#ff8d45; --muted:#aaa9a1;
  --display:'Lalezar','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--cream);font:400 16px/1.6 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange2);outline-offset:2px}
.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* contact block */
.contact{padding-block:18px 4px;display:grid;gap:12px}
.deliv{justify-self:start;display:inline-flex;align-items:center;gap:8px;background:rgba(232,101,31,.14);color:var(--orange2);border:1px solid rgba(232,101,31,.5);padding:6px 16px 6px 14px;border-radius:999px;font-weight:600;font-size:.98rem}
.deliv svg{flex:none}
.numrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.numrow small{color:var(--muted);font-size:.85rem}
.num{font:400 2.3rem/1.1 var(--display);letter-spacing:.07em;direction:ltr;unicode-bidi:isolate;color:var(--cream);user-select:all}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 6px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--cream);font-weight:600;font-size:.93rem;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--cream)}
.btn.wa{background:var(--orange);border-color:var(--orange);color:#17191c}
.btn.wa:hover{background:var(--orange2);border-color:var(--orange2)}

/* hero */
.hero{position:relative;width:min(88%,380px);margin:6px auto 0;aspect-ratio:960/1103}
.logo{position:absolute;inset:0;background-position:center;background-size:contain;background-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(ellipse 60% 56% at 50% 49%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 60% 56% at 50% 49%,#000 52%,transparent 100%)}
.hero::after{content:"";position:absolute;left:50%;top:3%;width:46%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,120,40,.5),rgba(232,101,31,.12) 45%,transparent 68%);animation:flick 2.6s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.35;transform:translateX(-50%) scale(.92)}60%{opacity:.8}100%{opacity:.6;transform:translateX(-50%) scale(1.05)}}
@media (prefers-reduced-motion:reduce){.hero::after{animation:none;opacity:.5}}

/* search + nav */
.search{padding-block:6px 14px}
.field{width:100%;min-height:46px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 16px;color:var(--cream)}
.field::placeholder{color:var(--muted)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(27,30,34,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 15px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:500;font-size:.92rem;white-space:nowrap}
.chip.on{background:var(--cream);color:#17191c;border-color:var(--cream)}
.chip.hotc{border-color:rgba(232,101,31,.6);color:var(--orange2)}
.chip.hotc.on{background:var(--orange);border-color:var(--orange);color:#17191c}

/* sections */
.note{color:var(--muted);font-size:.84rem;padding-block:12px 0}
section.cat{padding-block:26px 6px;scroll-margin-top:calc(64px + env(safe-area-inset-top,0px))}
.sh{display:flex;align-items:center;gap:14px}
.sh h2{margin:0;font:400 2.1rem/1.15 var(--display);color:var(--orange);text-wrap:balance}
.sh .rib{flex:1;height:14px;opacity:.6;
  background:
   linear-gradient(var(--cream),var(--cream)) right 0 top 0/100% 4px no-repeat,

.items{list-style:none;margin:6px 0 0;padding:0}
.it{display:grid;grid-template-columns:minmax(0,auto) minmax(12px,1fr) auto;align-items:end;gap:10px;padding-block:11px}
.nm{display:flex;flex-direction:column;min-width:0}
.nm .t{font-weight:600;font-size:1.04rem;line-height:1.4}
.nm .c{font-size:.76rem;color:var(--muted)}
.lead{align-self:end;height:.8em;margin-bottom:.45em;border-bottom:2px dotted var(--line)}
.pr{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.pc{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:2px 9px 4px;border-radius:9px;background:var(--panel)}
.pc b{font:400 1.3rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.pc em{font-style:normal;font-size:.7rem;color:var(--muted);line-height:1.2}
.pc.solo{background:none;padding:0;min-width:0}

  .it.multi{grid-template-columns:minmax(0,1fr);gap:6px}

  .it.multi .pr{justify-content:flex-start}
}
.hot{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.hc{position:relative;display:flex;flex-direction:column;gap:8px;min-height:112px;padding:14px 13px 12px;border-radius:14px;border:1px solid rgba(232,101,31,.45);background:linear-gradient(160deg,rgba(232,101,31,.24),rgba(232,101,31,.05))}

.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin-top:40px;padding-block:24px calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;display:grid;gap:10px;justify-items:start}

.abtns select{min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 8px;max-width:100%}
.toprow{display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.toprow span{flex:1;min-width:0;font-weight:500}

var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2600)}

/* ---------- helpers ---------- */
function findItem(id){for(var i=0;i<S.cats.length;i++){var c=S.cats[i];for(var j=0;j<c.items.length;j++)if(c.items[j].id===id)return{c:c,j:j,it:c.items[j]}}return null}
function swap(a,i,d){var j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t}
function tiers(it){return it.p.filter(function(x){return String(x[1]).trim()!==''})}
function priceHTML(it){var t=tiers(it);var solo=t.length===1&&!t[0][0];
  return '<div class="pr">'+t.map(function(x){return '<span class="pc'+(solo?' solo':'')+'"><b>'+esc(x[1])+'</b>'+(x[0]?'<em>'+esc(x[0])+'</em>':'')+'</span>'}).join('')+'</div>'}
function itemHTML(it){var n=tiers(it).length;
  return '<li class="it'+(n>=3?' multi':'')+'"><div class="nm"><span class="t">'+esc(it.n)+'</span>'+(it.c?'<span class="c">'+esc(it.c)+' سعرة</span>':'')+'</div><i class="lead"></i>'+priceHTML(it)+'</li>'}
function clean(){
  var seen={};
  var cats=S.cats.map(function(c){return{id:c.id,name:String(c.name).trim()||'قسم جديد',items:c.items.map(function(it){
    return{id:it.id,n:String(it.n).trim(),c:String(it.c).trim(),p:it.p.map(function(x){return[String(x[0]).trim(),String(x[1]).trim()]}).filter(function(x){return x[1]!==''})}
  }).filter(function(it){return it.n&&it.p.length})}});
  cats.forEach(function(c){c.items.forEach(function(i){seen[i.id]=1})});
  return{cats:cats,top:S.top.filter(function(id){return seen[id]})};
}

/* ---------- public menu ---------- */
function renderMenu(){
  var term=q.trim().toLowerCase(),h='',chips='';
  var hotItems=S.top.map(function(id){var f=findItem(id);return f&&f.it}).filter(Boolean);
  if(!term&&hotItems.length){
    chips+='<button class="chip hotc" data-sec="sec-top" type="button">الأكثر طلباً</button>';
    h+='<section class="cat" id="sec-top"><div class="sh"><h2>الأكثر طلباً</h2><span class="rib"></span></div><ul class="hot">'+
      hotItems.map(function(it){return '<li class="hc">'+FLAME+'<span class="t">'+esc(it.n)+'</span>'+priceHTML(it)+'</li>'}).join('')+'</ul></section>';
  }
  var shown=0;
  S.cats.forEach(function(c){
    var list=c.items.filter(function(it){return !term||it.n.toLowerCase().indexOf(term)>-1||c.name.toLowerCase().indexOf(term)>-1});
    if(!list.length)return;shown++;
    chips+='<button class="chip" data-sec="sec-'+c.id+'" type="button">'+esc(c.name)+'</button>';
    h+='<section class="cat" id="sec-'+c.id+'"><div class="sh"><h2>'+esc(c.name)+'</h2><span class="rib"></span></div><ul class="items">'+list.map(itemHTML).join('')+'</ul></section>';
  });
  if(!shown&&!hotItems.length||(!shown&&term))h='<p class="empty">لا توجد أصناف مطابقة.</p>';
  else h='<p class="note">الأسعار بالريال السعودي. السعرات الحرارية تقريبية لكل وجبة.</p>'+h;
  $('#menu').innerHTML=h;$('#chips').innerHTML=chips;
  watch();
}
function watch(){
  if(obs)obs.disconnect();
  if(!('IntersectionObserver' in window))return;
  obs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
    document.querySelectorAll('.chip').forEach(function(c){var on=c.dataset.sec===e.target.id;c.classList.toggle('on',on);if(on){var sc=$('#chips');var l=c.offsetLeft-sc.clientWidth/2+c.clientWidth/2;sc.scrollTo({left:l,behavior:'smooth'})}});
  }})},{rootMargin:'-25% 0px -65% 0px'});
  document.querySelectorAll('#menu section.cat').forEach(function(s){obs.observe(s)});
}

function catOptions(sel){return S.cats.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')}
function renderAdmin(focusId){

  h+='<div class="abtns"><select id="addtop" data-f="addtop" aria-label="إضافة صنف إلى الأكثر طلباً"><option value="">إضافة صنف إلى «الأكثر طلباً»…</option>'+
    S.cats.map(function(c){var o=c.items.filter(function(it){return S.top.indexOf(it.id)<0&&it.n}).map(function(it){return '<option value="'+it.id+'">'+esc(it.n)+'</option>'}).join('');return o?'<optgroup label="'+esc(c.name)+'">'+o+'</optgroup>':''}).join('')+'</select></div></section>';
  /* categories */
  S.cats.forEach(function(c,ci){
    h+='<section class="acat" data-cat="'+c.id+'"><div class="ahead"><input class="in" data-f="catname" value="'+esc(c.name)+'" aria-label="اسم القسم">'+
     '<button class="ab" data-a="catup" type="button" aria-label="رفع القسم"'+(ci===0?' disabled':'')+'>▲</button><button class="ab" data-a="catdown" type="button" aria-label="خفض القسم"'+(ci===S.cats.length-1?' disabled':'')+'>▼</button>'+
     '<button class="ab del'+(armed==='c'+c.id?' armed':'')+'" data-a="delcat" type="button">'+(armed==='c'+c.id?'تأكيد حذف القسم':'حذف القسم')+'</button></div>';
    c.items.forEach(function(it,ii){
      var isTop=S.top.indexOf(it.id)>-1;
      h+='<div class="ai" data-item="'+it.id+'"><div class="arow"><input class="in" data-f="n" placeholder="اسم الصنف" value="'+esc(it.n)+'" aria-label="اسم الصنف"><input class="in" data-f="c" inputmode="numeric" placeholder="سعرات" value="'+esc(it.c)+'" aria-label="السعرات"></div><div class="tiers">';
      it.p.forEach(function(x,i){h+='<div class="tier"><input class="in" data-f="pl" data-i="'+i+'" placeholder="الحجم (اختياري)" value="'+esc(x[0])+'" aria-label="الحجم"><input class="in" data-f="pp" data-i="'+i+'" inputmode="decimal" placeholder="السعر" value="'+esc(x[1])+'" aria-label="السعر"><button class="ab" data-a="deltier" data-i="'+i+'" type="button" aria-label="حذف السعر"'+(it.p.length<2?' disabled':'')+'>✕</button></div>'});
      h+='</div><div class="abtns"><button class="ab" data-a="addtier" type="button">+ سعر</button>'+
        '<button class="ab" data-a="up" type="button" aria-label="رفع الصنف"'+(ii===0?' disabled':'')+'>▲</button><button class="ab" data-a="down" type="button" aria-label="خفض الصنف"'+(ii===c.items.length-1?' disabled':'')+'>▼</button>'+
        '<button class="ab'+(isTop?' on':'')+'" data-a="top" type="button">'+(isTop?'★ في الأكثر طلباً':'☆ أكثر طلباً')+'</button>'+
        '<select data-f="move" aria-label="نقل إلى قسم"><option value="">نقل إلى…</option>'+S.cats.filter(function(k){return k.id!==c.id}).map(function(k){return '<option value="'+k.id+'">'+esc(k.name)+'</option>'}).join('')+'</select>'+
        '<button class="ab del'+(armed===it.id?' armed':'')+'" data-a="delitem" type="button">'+(armed===it.id?'تأكيد الحذف':'حذف')+'</button></div></div>';
    });
    h+='<div class="abtns"><button class="ab pri" data-a="additem" type="button">+ إضافة صنف</button></div></section>';
  });
  h+='<div class="addcat"><input class="in" id="newcat" placeholder="اسم قسم جديد" aria-label="اسم قسم جديد"><button class="ab pri" data-a="addcat" type="button">+ إضافة قسم</button></div><div class="pad"></div></div>';
  $('#adm').innerHTML=h;
  if(focusId){var f=$('[data-item="'+focusId+'"] [data-f=n]');if(f){f.focus();f.scrollIntoView({block:'center'})}}
}
function mark(){dirty=true;bar()}
function bar(){var s=$('#st');s.textContent=saving?'جارٍ الحفظ…':dirty?'توجد تعديلات غير محفوظة':'لا توجد تعديلات';s.className='st'+(dirty?' dirty':'');$('#save').disabled=!dirty||saving}
function setMode(on){
  admin=on;$('#pub').hidden=on;$('#adm').hidden=!on;$('#bar').hidden=!on;
  if(on){renderAdmin();bar();window.scrollTo(0,0)}else{renderMenu();window.scrollTo(0,0)}
}
function enter(){
  if(!art){toast('لوحة المشرف تعمل من رابط المنيو داخل حسابك على Claude');return}
  if(canEdit===false){toast('هذه اللوحة للمشرف فقط');return}
  setMode(true);
}
function exit(){
  if(dirty&&armed!=='exit'){armed='exit';$('#exit').textContent='تجاهل التعديلات؟';$('#exit').classList.add('del','armed');return}
  armed='';S=JSON.parse(stateText);dirty=false;$('#exit').textContent='خروج';$('#exit').classList.remove('del','armed');setMode(false);
}
async function save(){
  if(saving||!dirty)return;saving=true;bar();
  var doc=buildDoc();
  try{await art.publish(doc);toast('تم الحفظ والنشر')}
  catch(e){saving=false;bar();var c=e&&e.code;
    toast(c==='conflict'?'تم تحديث المنيو من مكان آخر، سيُعاد التحميل':(c==='not_writer'||c==='not_granted'||c==='not_declared')?'ليست لديك صلاحية تعديل هذا المنيو':c==='rate_limited'?'حاول مرة أخرى بعد قليل':'تعذّر الحفظ، حاول مرة أخرى')}
}
function buildDoc(){
  var css=document.getElementById('appstyle').textContent;
  var code=document.getElementById('appcode').textContent;
  var st=JSON.stringify(clean()).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD+
   '<style id="appstyle">'+css+'</style>\n<div id="app"></div>\n<script type="application/json" id="state">'+st+'<\/script>\n<script id="appcode">'+code+'<\/script></body></html>';
}


function goTo(id){
  var s=document.getElementById(id);if(!s)return;
  try{s.scrollIntoView({block:'start'})}catch(_){}
  setTimeout(function(){
    var nav=document.querySelector('.nav'),off=(nav?nav.offsetHeight:60)+8,top=s.getBoundingClientRect().top;
    if(top>off+40||top<-4){var y=top+(window.pageYOffset||document.documentElement.scrollTop||0)-off;try{window.scrollTo(0,y)}catch(_){}try{document.documentElement.scrollTop=y;document.body.scrollTop=y}catch(_){}}
  },120);
}
/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.sec){goTo(t.dataset.sec);return}
  if(t.id==='copy'){
    var done=function(){toast('تم نسخ الرقم')};
    var fb=function(){try{var r=document.createRange();r.selectNodeContents($('#num'));var sl=getSelection();sl.removeAllRanges();sl.addRange(r);if(document.execCommand('copy'))return done()}catch(_){}toast('حدّد الرقم ثم انسخه')};
    try{navigator.clipboard.writeText(PHONE).then(done,fb)}catch(_){fb()}return}
  if(t.id==='pwx'){$('#pwb').hidden=true;return}
  if(t.id==='exit'){exit();return}
  if(t.id==='save'){save();return}
  var a=t.dataset.a;if(!a)return;
  var itEl=t.closest('[data-item]'),catEl=t.closest('[data-cat]'),topEl=t.closest('[data-top]');
  var id=itEl&&itEl.dataset.item,f=id&&findItem(id),focus=null;
  var keepArmed=(a==='delitem'||a==='delcat');if(!keepArmed)armed='';
  if(a==='addcat'){var nm=$('#newcat').value.trim();if(!nm){toast('اكتب اسم القسم أولاً');return}S.cats.push({id:uid(),name:nm,items:[]})}
  else if(a==='catup'||a==='catdown'){var i=S.cats.findIndex(function(c){return c.id===catEl.dataset.cat});swap(S.cats,i,a==='catup'?-1:1)}
  else if(a==='delcat'){var cid=catEl.dataset.cat;if(armed!=='c'+cid){armed='c'+cid}else{var gone=S.cats.find(function(c){return c.id===cid});S.top=S.top.filter(function(x){return !gone.items.some(function(it){return it.id===x})});S.cats=S.cats.filter(function(c){return c.id!==cid});armed=''}}
  else if(a==='additem'){var c=S.cats.find(function(c){return c.id===catEl.dataset.cat});var ni={id:uid(),n:'',c:'',p:[['','']]};c.items.push(ni);focus=ni.id}
  else if(f&&a==='up')swap(f.c.items,f.j,-1);
  else if(f&&a==='down')swap(f.c.items,f.j,1);
  else if(f&&a==='addtier')f.it.p.push(['','']);
  else if(f&&a==='deltier'){if(f.it.p.length>1)f.it.p.splice(+t.dataset.i,1)}
  else if(f&&a==='top'){var k=S.top.indexOf(id);if(k>-1)S.top.splice(k,1);else S.top.push(id)}
  else if(f&&a==='delitem'){if(armed!==id){armed=id}else{f.c.items.splice(f.j,1);S.top=S.top.filter(function(x){return x!==id});armed=''}}
  else if(topEl){var tid=topEl.dataset.top,ti=S.top.indexOf(tid);if(a==='topup')swap(S.top,ti,-1);else if(a==='topdown')swap(S.top,ti,1);else if(a==='topdel')S.top.splice(ti,1)}
  else return;
  if(a!=='delitem'&&a!=='delcat'||armed===''){mark()}
  var y=window.scrollY;renderAdmin(focus);if(!focus)window.scrollTo(0,y);
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){q=el.value;renderMenu();return}
  var f=el.dataset.f;if(!f)return;
  if(f==='catname'){var c=S.cats.find(function(c){return c.id===el.closest('[data-cat]').dataset.cat});c.name=el.value;mark();return}
  var it=el.closest('[data-item]');if(!it)return;var fi=findItem(it.dataset.item);if(!fi)return;
  if(f==='n')fi.it.n=el.value;else if(f==='c')fi.it.c=el.value;
  else if(f==='pl')fi.it.p[+el.dataset.i][0]=el.value;else if(f==='pp')fi.it.p[+el.dataset.i][1]=el.value;
  mark();
});
document.addEventListener('change',function(e){
  var el=e.target,f=el.dataset.f;
  if(f==='addtop'&&el.value){S.top.push(el.value);mark();renderAdmin()}
  else if(f==='move'&&el.value){var it=el.closest('[data-item]');var fi=findItem(it.dataset.item);var dest=S.cats.find(function(c){return c.id===el.value});fi.c.items.splice(fi.j,1);dest.items.push(fi.it);mark();var y=window.scrollY;renderAdmin();window.scrollTo(0,y);toast('نُقل الصنف إلى «'+dest.name+'»')}
  else if(f==='catname'||f==='n'){/* names changed: refresh selects on blur */if(admin){var y2=window.scrollY;var ae=document.activeElement;if(!ae||ae===el){/* keep focus: skip re-render */}}}
});
